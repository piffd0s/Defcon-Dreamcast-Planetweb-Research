var acc = 0;
var cur = "0";

function show() {

}

function digit(n) {
  if (fresh) { cur = "" + n; fresh = 0; }
  else if (cur.length < 12) { cur = cur + n; }
  show();
}

function doOp(o) {
  calc();
  op = o;
  fresh = 1;
}

function calc() {
  var v = cur - 0;
  if (op == "+") { acc = acc + v; }
  else if (op == "-") { acc = acc - v; }
  else if (op == "*") { acc = acc * v; }
  else if (op == "/") { acc = (v != 0) ? acc / v : 0; }
  else { acc = v; }
  cur = "" + acc;
  op = "";
  fresh = 1;
  show();
}

function clr() {
  acc = 0; cur = "0"; op = ""; fresh = 1;
  show();
}
</script>
